projects:
  - id: "project"
    # Keep disabled to require human approval before merging implementation PRs.
    autoMerge: false

    trello:
      boardId: "board-id"
      backlogListId: "backlog-list-id"
      readyListId: "ready-list-id"
      workingListId: "working-list-id"
      reviewListId: "review-list-id"
      failedListId: "failed-list-id"
      doneListId: "done-list-id"
      refinementLabelId: "refinement-label-id"
      featureLabelId: "feature-label-id"
      improvementLabelId: "improvement-label-id"
      bugLabelId: "bug-label-id"

    repository:
      path: "/absolute/path/to/repository"
      github: "owner/repository"
      defaultBranch: "main"
      worktreeRoot: "/absolute/path/to/worktrees/repository"
      setupCommand: "yarn install"
      validationCommand: "yarn test"
      gitIdentity:
        name: "Agent Orchestrator"
        email: "agent-orchestrator@users.noreply.github.com"
        signingKey: "/absolute/path/to/agent-orchestrator-signing-key"
      # Optional future GitHub App identity. Keep all three fields together.
      # githubApp:
      #   appId: "123456789"
      #   installationId: "987654321"
      #   privateKeyPath: "/absolute/path/to/github-app-private-key.pem"

    opencode:
      timeoutMinutes: 360
      refinement:
        model: "your-refinement-model"
        variant: "xhigh"
      implementation:
        model: "your-implementation-model"
        variant: "xhigh"
      review:
        model: "your-review-model"
        variant: "high"
      remediation:
        model: "your-remediation-model"
        variant: "xhigh"
        # Defaults to 1; the initial review is not counted, and no review runs after the final pass.
        maxPasses: 1
      commit:
        model: "your-commit-model"
        variant: "low"

  - id: "another-project"
    autoMerge: false

    trello:
      boardId: "another-board-id"
      backlogListId: "..."
      readyListId: "..."
      workingListId: "..."
      reviewListId: "..."
      failedListId: "..."
      doneListId: "..."
      refinementLabelId: "..."
      featureLabelId: "..."
      improvementLabelId: "..."
      bugLabelId: "..."

    repository:
      path: "/absolute/path/to/another-repository"
      github: "owner/another-repository"
      defaultBranch: "main"
      worktreeRoot: "/absolute/path/to/worktrees/another-repository"
      setupCommand: "yarn install"
      validationCommand: "yarn test"
      gitIdentity:
        name: "Agent Orchestrator"
        email: "agent-orchestrator@users.noreply.github.com"
        signingKey: "/absolute/path/to/agent-orchestrator-signing-key"

    opencode:
      timeoutMinutes: 360
      refinement:
        model: "your-refinement-model"
        variant: "xhigh"
      implementation:
        model: "your-implementation-model"
        variant: "xhigh"
      review:
        model: "your-review-model"
        variant: "high"
      remediation:
        model: "your-remediation-model"
        variant: "xhigh"
        # The initial review is not counted; follow-up reviews run only between remediation passes.
        maxPasses: 1
      commit:
        model: "your-commit-model"
        variant: "low"

notifications:
  email:
    enabled: false
    # Omitted events default to true when email is enabled.
    events:
      humanReview: true
      failed: true
      refinementComplete: true
      done: true
      attentionRequired: true
    recipients:
      - "reviewers@example.com"
    from: "agent-orchestrator@example.com"
    smtp:
      host: "smtp.example.com"
      port: 465
      # true uses implicit TLS; false requires a STARTTLS upgrade.
      secure: true
      usernameEnv: "SMTP_USERNAME"
      passwordEnv: "SMTP_PASSWORD"
      timeoutSeconds: 30

workflow:
  pollIntervalSeconds: 15
  logRetentionDays: 14
  contextRetentionDays: 14
  # Optional; defaults to /opt/.agent-context. Keep this outside repositories and worktree roots.
  contextRoot: "/opt/.agent-context"
  # Optional; defaults to 50 MiB per uploaded file and 200 MiB for new downloads per preparation.
  maxAttachmentBytes: 52428800
  maxTotalAttachmentBytes: 209715200
