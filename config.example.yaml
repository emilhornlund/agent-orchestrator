projects:
  - id: "project"

    trello:
      boardId: "board-id"
      backlogListId: "backlog-list-id"
      readyListId: "ready-list-id"
      workingListId: "working-list-id"
      reviewListId: "review-list-id"
      failedListId: "failed-list-id"
      doneListId: "done-list-id"
      refinementLabelId: "refinement-label-id"
      featureLabelId: "feature-label-id"
      improvementLabelId: "improvement-label-id"
      bugLabelId: "bug-label-id"

    repository:
      path: "/absolute/path/to/repository"
      github: "owner/repository"
      defaultBranch: "main"
      worktreeRoot: "/absolute/path/to/worktrees/repository"
      setupCommand: "yarn install"
      validationCommand: "yarn test"
      gitIdentity:
        name: "Agent Orchestrator"
        email: "agent-orchestrator@users.noreply.github.com"
        signingKey: "/absolute/path/to/agent-orchestrator-signing-key"

    opencode:
      timeoutMinutes: 360
      refinement:
        model: "your-refinement-model"
        variant: "xhigh"
      implementation:
        model: "your-implementation-model"
        variant: "xhigh"
      review:
        model: "your-review-model"
        variant: "high"
      remediation:
        model: "your-remediation-model"
        variant: "xhigh"
      commit:
        model: "your-commit-model"
        variant: "low"

  - id: "another-project"

    trello:
      boardId: "another-board-id"
      backlogListId: "..."
      readyListId: "..."
      workingListId: "..."
      reviewListId: "..."
      failedListId: "..."
      doneListId: "..."
      refinementLabelId: "..."
      featureLabelId: "..."
      improvementLabelId: "..."
      bugLabelId: "..."

    repository:
      path: "/absolute/path/to/another-repository"
      github: "owner/another-repository"
      defaultBranch: "main"
      worktreeRoot: "/absolute/path/to/worktrees/another-repository"
      setupCommand: "yarn install"
      validationCommand: "yarn test"
      gitIdentity:
        name: "Agent Orchestrator"
        email: "agent-orchestrator@users.noreply.github.com"
        signingKey: "/absolute/path/to/agent-orchestrator-signing-key"

    opencode:
      timeoutMinutes: 360
      refinement:
        model: "your-refinement-model"
        variant: "xhigh"
      implementation:
        model: "your-implementation-model"
        variant: "xhigh"
      review:
        model: "your-review-model"
        variant: "high"
      remediation:
        model: "your-remediation-model"
        variant: "xhigh"
      commit:
        model: "your-commit-model"
        variant: "low"

workflow:
  pollIntervalSeconds: 15
  logRetentionDays: 14
