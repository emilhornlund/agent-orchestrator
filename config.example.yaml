projects:
  - id: "project"

    trello:
      boardId: "board-id"
      readyListId: "ready-list-id"
      workingListId: "working-list-id"
      reviewListId: "review-list-id"
      failedListId: "failed-list-id"
      doneListId: "done-list-id"

    repository:
      path: "/absolute/path/to/repository"
      github: "owner/repository"
      defaultBranch: "main"
      worktreeRoot: "/absolute/path/to/worktrees/repository"
      setupCommand: "yarn install"
      validationCommand: "yarn test"

    opencode:
      timeoutMinutes: 360
      implementation:
        model: "your-implementation-model"
        variant: "xhigh"
      review:
        model: "your-review-model"
        variant: "high"
      remediation:
        model: "your-remediation-model"
        variant: "xhigh"
      commit:
        model: "your-commit-model"
        variant: "low"

  - id: "another-project"

    trello:
      boardId: "another-board-id"
      readyListId: "..."
      workingListId: "..."
      reviewListId: "..."
      failedListId: "..."
      doneListId: "..."

    repository:
      path: "/absolute/path/to/another-repository"
      github: "owner/another-repository"
      defaultBranch: "main"
      worktreeRoot: "/absolute/path/to/worktrees/another-repository"
      setupCommand: "yarn install"
      validationCommand: "yarn test"

    opencode:
      timeoutMinutes: 360
      implementation:
        model: "your-implementation-model"
        variant: "xhigh"
      review:
        model: "your-review-model"
        variant: "high"
      remediation:
        model: "your-remediation-model"
        variant: "xhigh"
      commit:
        model: "your-commit-model"
        variant: "low"

workflow:
  pollIntervalSeconds: 15
