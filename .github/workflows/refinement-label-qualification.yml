name: Refinement label correction qualification
on:
  push:
    branches: [fix/refinement-label-reconciliation]
    paths: [.github/workflows/refinement-label-qualification.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.prepare.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: prepare
        name: Prepare reviewed correction without updating any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYCODE'
          import base64, gzip, json, os, pathlib, subprocess, urllib.request
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          expected = {
              'src/refinement/refinement-card-guard.ts': 'c37e947710a9eec049941d9ce0419af2ae2f20a0',
              'src/trello/trello-client.ts': '2afd6aec6328bee37b8fcb7ce4c3f8defed58357',
              'tests/support/notification-authority-fixture.ts': '410085a60f015df79753b7b13101ea94d6bb67d6',
              'tests/task-session-refinement-scheduling.test.ts': '4ea107f9a68d8c6b63097089557ca8b3d34fae22',
              'tests/preparing-attempt-resume.integration.test.ts': '111078238c94f558fbd73bc5a83657ff4103771e',
          }
          for name, sha in expected.items():
              assert git('hash-object', name) == sha, name
          data = json.loads(gzip.decompress(base64.b64decode('')))
          subprocess.run(['git', 'apply', '--index', '-'], input=data['patch'], text=True, check=True)
          new_paths = {'tests/refinement-label-reconciliation.integration.test.ts', 'docs/refinement-label-reconciliation.md'}
          assert set(data['files']) == new_paths
          for name, content in data['files'].items():
              path = pathlib.Path(name)
              assert not path.exists(), name
              path.write_text(content)
              git('add', name)
          temporary = '.github/workflows/refinement-label-qualification.yml'
          git('rm', temporary)
          paths = git('diff', '--cached', '--name-only').splitlines()
          assert set(paths) == set(expected) | new_paths | {temporary}
          def api(endpoint, payload):
              request = urllib.request.Request(
                  'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + '/git/' + endpoint,
                  data=json.dumps(payload).encode(),
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'},
                  method='POST',
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)
          entries = []
          for name in paths:
              sha = None if name == temporary else api('blobs', {'content': pathlib.Path(name).read_text(), 'encoding': 'utf-8'})['sha']
              entries.append({'path': name, 'mode': '100644', 'type': 'blob', 'sha': sha})
          tree = api('trees', {'base_tree': git('rev-parse', 'HEAD^{tree}'), 'tree': entries})['sha']
          identity = {'name': git('show', '-s', '--format=%an', 'HEAD'), 'email': git('show', '-s', '--format=%ae', 'HEAD')}
          commit = api('commits', {
              'message': 'fix(refinement): reconcile labels using journaled card readback\n\n- Verify the exact dispatched label delta without unavailable REST action history.\n- Preserve full-field conflict checks and resume existing checkpoints without replay.\n- Cover real provider responses, lease takeover, lost acknowledgements and image packaging.\n\nAllow partially refined cards to finish safely after redeployment.',
              'tree': tree, 'parents': [git('rev-parse', 'HEAD')], 'author': identity, 'committer': identity,
          })['sha']
          print('PREPARED_COMMIT=' + commit)
          print('PREPARED_TREE=' + tree)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('sha=' + commit + '\n')
          PYCODE
  image:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - name: Build the corrected production image
        run: docker build -f Containerfile -t refinement-label-check .
      - name: Verify packaged correction without live service credentials
        run: |
          docker run --rm --entrypoint node refinement-label-check --input-type=module -e '
          import assert from "node:assert/strict";
          import fs from "node:fs";
          import { guardRefinementFields } from "./dist/refinement/refinement-card-guard.js";
          import { TrelloClient } from "./dist/trello/trello-client.js";
          assert.notEqual(process.getuid(), 0);
          assert.ok(fs.existsSync("scripts/contained-process-supervisor.mjs"));
          assert.equal(typeof TrelloClient, "function");
          const value = { cardId: "card", reconciliation: { actorId: "actor", cursor: null, verified: { title: "Task", description: "Refined", labels: ["refinement"] }, pending: { title: "Task", description: "Refined", labels: ["refinement", "improvement"] } } };
          const authority = { read: () => value, mutate: (_key, _initial, update) => update() };
          const trello = { getRefinementHistory: async () => ({ actorId: "actor", actions: [] }), getCard: async () => ({ id: "card", name: "Task", desc: "Refined", idLabels: ["refinement", "improvement"] }) };
          assert.equal(await guardRefinementFields(trello, authority, "after", { labelId: "improvement", present: true }), true);
          assert.equal(value.reconciliation.pending, undefined);
          console.log("Non-root packaged label recovery: passed");
          '
