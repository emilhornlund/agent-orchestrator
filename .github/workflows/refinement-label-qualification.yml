name: Refinement label correction qualification
on:
  push:
    branches: [fix/refinement-label-reconciliation]
    paths: [.github/workflows/refinement-label-qualification.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.prepare.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: prepare
        name: Prepare digest-verified correction without updating any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYCODE'
          import base64, gzip, hashlib, re, subprocess, textwrap
          source = subprocess.check_output([
              'git', 'show', '54180baa7fb1ce3055c0e46f2399a3ef4830dadc:.github/workflows/refinement-label-qualification.yml'
          ], text=True)
          script = textwrap.dedent(source.split("python3 - <<'PYCODE'\n", 1)[1].split('          PYCODE\n', 1)[0])
          script = script.replace('JB66oe6e', 'JB6oe6e').replace('jdf+e517', 'jdf+517')
          payload = re.search(r"base64.b64decode\('([^']+)'\)", script).group(1)
          decoded = gzip.decompress(base64.b64decode(payload, validate=True))
          assert hashlib.sha256(decoded).hexdigest() == 'b4492cd561d58405a095dfb20f6c4ff6a11682179e54359d27816c74d198638d'
          exec(compile(script, '<verified-correction>', 'exec'))
          PYCODE
  image:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - name: Build the corrected production image
        run: docker build -f Containerfile -t refinement-label-check .
      - name: Verify packaged correction without live service credentials
        run: |
          docker run --rm --entrypoint node refinement-label-check --input-type=module -e '
          import assert from "node:assert/strict";
          import fs from "node:fs";
          import { guardRefinementFields } from "./dist/refinement/refinement-card-guard.js";
          import { TrelloClient } from "./dist/trello/trello-client.js";
          assert.notEqual(process.getuid(), 0);
          assert.ok(fs.existsSync("scripts/contained-process-supervisor.mjs"));
          assert.equal(typeof TrelloClient, "function");
          const value = { cardId: "card", reconciliation: { actorId: "actor", cursor: null, verified: { title: "Task", description: "Refined", labels: ["refinement"] }, pending: { title: "Task", description: "Refined", labels: ["refinement", "improvement"] } } };
          const authority = { read: () => value, mutate: (_key, _initial, update) => update() };
          const trello = { getRefinementHistory: async () => ({ actorId: "actor", actions: [] }), getCard: async () => ({ id: "card", name: "Task", desc: "Refined", idLabels: ["refinement", "improvement"] }) };
          assert.equal(await guardRefinementFields(trello, authority, "after", { labelId: "improvement", present: true }), true);
          assert.equal(value.reconciliation.pending, undefined);
          console.log("Non-root packaged label recovery: passed");
          '
