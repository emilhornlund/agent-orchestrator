name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Provision and verify process isolation
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          # Provision this disposable runner for the same nested namespaces
          # required by the production startup probe. Ubuntu's AppArmor userns
          # restriction otherwise blocks nested execution and process supervision.
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          if sysctl -n kernel.unprivileged_userns_clone >/dev/null 2>&1; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          # The executable-specific Ubuntu profile also affects nested bwrap
          # after its no-new-privileges transition. Remove only that profile on
          # this disposable runner, retaining other AppArmor profiles.
          if [ -f /etc/apparmor.d/bwrap ] && [ -d /sys/kernel/security/apparmor ]; then
            sudo apparmor_parser --remove /etc/apparmor.d/bwrap
          fi
          bwrap --version
          if ! bwrap --die-with-parent --new-session --unshare-pid --ro-bind / / --proc /proc --dev /dev -- \
            bwrap --die-with-parent --new-session --unshare-pid --ro-bind / / --proc /proc --dev /dev -- /bin/true; then
            id
            uname -a
            command -v bwrap
            sysctl user.max_user_namespaces kernel.apparmor_restrict_unprivileged_userns kernel.unprivileged_userns_clone
            cat /proc/self/attr/current
            sudo aa-status || true
            sudo journalctl --dmesg --lines=40 --no-pager
            exit 1
          fi

      - name: Check formatting
        run: yarn format:check

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn typecheck

      - name: Test
        run: yarn test

      - name: Build
        run: yarn build
