name: Recovery image qualification

on:
  push:
    branches:
      - fix/refinement-recovery-loop
    paths:
      - .github/workflows/refinement-recovery-image-check.yml

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Provision isolated process test runtime
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          if sysctl -n kernel.unprivileged_userns_clone >/dev/null 2>&1; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          for profile in /etc/apparmor.d/bwrap /etc/apparmor.d/bwrap-userns-restrict; do
            if [ -f "$profile" ] && [ -d /sys/kernel/security/apparmor ]; then
              sudo apparmor_parser --remove "$profile"
            fi
          done
          bwrap --die-with-parent --new-session --unshare-pid --ro-bind / / --proc /proc --dev /dev -- \
            bwrap --die-with-parent --new-session --unshare-pid --ro-bind / / --proc /proc --dev /dev -- /bin/true
      - run: yarn validate
      - run: yarn build
      - name: Build production container
        run: docker build --progress=plain -f Containerfile -t agent-orchestrator-recovery-check .
      - name: Verify packaged runtime without connecting to live services
        run: |
          docker run --rm --entrypoint sh agent-orchestrator-recovery-check -ec '
            test "$(id -u)" != 0
            test -r scripts/contained-process-supervisor.mjs
            node --check scripts/contained-process-supervisor.mjs
            node --input-type=module -e "await import(\"./dist/refinement/refinement-recovery.js\"); await import(\"./dist/orchestrator/run-task-session-workflow.js\"); console.log(\"Recovery runtime imports OK\")"
            bwrap --version
            gh --version
            opencode --version
          '
